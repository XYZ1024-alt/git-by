<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-labelledby="git-by-card-title git-by-card-desc">
  <title id="git-by-card-title">git-by — AI Provenance Analytics</title>
  <desc id="git-by-card-desc">GitHub Dark AI provenance report for git-by showing Human vs AI Commit and LOC ratios, Top Implementer models, and Top Planner models.</desc>

  <defs>
    <linearGradient id="header-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="ai-commit-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="ai-loc-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <clipPath id="outer-clip">
      <rect x="1" y="1" width="838" height="418" rx="12"/>
    </clipPath>
    <clipPath id="commit-bar-clip">
      <rect x="36" y="114" width="768" height="10" rx="5"/>
    </clipPath>
    <clipPath id="loc-bar-clip">
      <rect x="36" y="160" width="768" height="10" rx="5"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .title { fill: #f0f6fc; font-size: 18px; font-weight: 700; }
    .badge-txt { fill: #58a6ff; font-size: 10.5px; font-weight: 600; letter-spacing: 0.6px; }
    .meta { fill: #8b949e; font-size: 12px; }
    .sec-label { fill: #8b949e; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
    .sec-head { fill: #f0f6fc; font-size: 11.5px; font-weight: 700; letter-spacing: 0.5px; }
    .sec-tag { fill: #8b949e; font-size: 10.5px; }
    .model-name { fill: #c9d1d9; font-size: 12px; }
    .model-stat { fill: #8b949e; font-size: 11.5px; }
    .foot { fill: #8b949e; font-size: 11.5px; }
  </style>

  <!-- Outer Card Background & Header -->
  <g clip-path="url(#outer-clip)">
    <rect x="1" y="1" width="838" height="418" fill="#0d1117"/>
    <rect x="1" y="1" width="838" height="64" fill="#161b22"/>
    <rect x="1" y="1" width="838" height="3" fill="url(#header-accent)"/>
    <line x1="1" y1="65" x2="839" y2="65" stroke="#30363d" stroke-width="1"/>
  </g>
  <rect x="1" y="1" width="838" height="418" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header Content -->
  <g transform="translate(24, 22)">
    <circle cx="6" cy="6" r="3" fill="none" stroke="#58a6ff" stroke-width="1.8"/>
    <circle cx="18" cy="6" r="3" fill="none" stroke="#a371f7" stroke-width="1.8"/>
    <circle cx="6" cy="18" r="3" fill="none" stroke="#3fb950" stroke-width="1.8"/>
    <path d="M6 9 L6 15 M18 9 C18 13, 6 11, 6 15" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <text x="54" y="40" class="mono title">git-by</text>
  <rect x="128" y="23" width="132" height="22" rx="11" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="194" y="38" text-anchor="middle" class="sans badge-txt">AI PROVENANCE</text>
  <text x="816" y="39" text-anchor="end" class="mono meta">148 Commits &#183; 18,420 LOC &#183; Kernel Assisted-by Spec</text>

  <!-- Section 1: Human vs AI Commit & LOC Ratio -->
  <rect x="20" y="80" width="800" height="106" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Commit Ratio Bar -->
  <text x="36" y="105" class="sans sec-label">COMMITS</text>
  <circle cx="108" cy="101" r="4" fill="#58a6ff"/>
  <text x="118" y="105" class="mono model-name">AI-Assisted: 109 (73.6%)</text>
  <circle cx="635" cy="101" r="4" fill="#3fb950"/>
  <text x="804" y="105" text-anchor="end" textLength="159" class="mono model-name">Human Solo: 39 (26.4%)</text>
  <g clip-path="url(#commit-bar-clip)">
    <rect x="36" y="114" width="768" height="10" fill="#21262d"/>
    <rect x="36" y="114" width="565" height="10" fill="url(#ai-commit-grad)"/>
    <rect x="603" y="114" width="201" height="10" fill="#2ea043"/>
  </g>

  <!-- LOC Ratio Bar -->
  <text x="36" y="151" class="sans sec-label">LOC CHANGED</text>
  <circle cx="132" cy="147" r="4" fill="#a371f7"/>
  <text x="142" y="151" class="mono model-name">AI: +11,840 / -2,190 (76.2%)</text>
  <circle cx="592" cy="147" r="4" fill="#3fb950"/>
  <text x="804" y="151" text-anchor="end" textLength="202" class="mono model-name">Human: +3,410 / -980 (23.8%)</text>
  <g clip-path="url(#loc-bar-clip)">
    <rect x="36" y="160" width="768" height="10" fill="#21262d"/>
    <rect x="36" y="160" width="585" height="10" fill="url(#ai-loc-grad)"/>
    <rect x="623" y="160" width="181" height="10" fill="#2ea043"/>
  </g>

  <!-- Section 2 Left: Top Implementer Models -->
  <rect x="20" y="198" width="392" height="178" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="36" y="221" class="sans sec-head">TOP IMPLEMENTERS</text>
  <text x="396" y="221" text-anchor="end" class="mono sec-tag">X-Agent-Implementer</text>
  <line x1="20" y1="232" x2="412" y2="232" stroke="#21262d" stroke-width="1"/>

  <!-- Implementer 1 -->
  <text x="36" y="256" class="mono model-name">claude-sonnet-4</text>
  <rect x="166" y="247" width="136" height="8" rx="4" fill="#21262d"/>
  <rect x="166" y="247" width="108" height="8" rx="4" fill="#58a6ff"/>
  <text x="396" y="256" text-anchor="end" class="mono model-stat">51 (46.8%)</text>

  <!-- Implementer 2 -->
  <text x="36" y="288" class="mono model-name">gpt-6-astra</text>
  <rect x="166" y="279" width="136" height="8" rx="4" fill="#21262d"/>
  <rect x="166" y="279" width="68" height="8" rx="4" fill="#79c0ff"/>
  <text x="396" y="288" text-anchor="end" class="mono model-stat">32 (29.4%)</text>

  <!-- Implementer 3 -->
  <text x="36" y="320" class="mono model-name">gemini-3-pro</text>
  <rect x="166" y="311" width="136" height="8" rx="4" fill="#21262d"/>
  <rect x="166" y="311" width="36" height="8" rx="4" fill="#a5d6ff"/>
  <text x="396" y="320" text-anchor="end" class="mono model-stat">17 (15.6%)</text>

  <!-- Implementer 4 -->
  <text x="36" y="352" class="mono model-name">deepseek-v4.1</text>
  <rect x="166" y="343" width="136" height="8" rx="4" fill="#21262d"/>
  <rect x="166" y="343" width="19" height="8" rx="4" fill="#388bfd"/>
  <text x="396" y="352" text-anchor="end" class="mono model-stat">9 (8.2%)</text>

  <!-- Section 2 Right: Top Planner Models -->
  <rect x="428" y="198" width="392" height="178" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="444" y="221" class="sans sec-head">TOP PLANNERS</text>
  <text x="804" y="221" text-anchor="end" class="mono sec-tag">X-Agent-Planner</text>
  <line x1="428" y1="232" x2="820" y2="232" stroke="#21262d" stroke-width="1"/>

  <!-- Planner 1 -->
  <text x="444" y="256" class="mono model-name">openai/o3</text>
  <rect x="574" y="247" width="136" height="8" rx="4" fill="#21262d"/>
  <rect x="574" y="247" width="110" height="8" rx="4" fill="#a371f7"/>
  <text x="804" y="256" text-anchor="end" class="mono model-stat">38 (48.1%)</text>

  <!-- Planner 2 -->
  <text x="444" y="288" class="mono model-name">claude-opus-4</text>
  <rect x="574" y="279" width="136" height="8" rx="4" fill="#21262d"/>
  <rect x="574" y="279" width="76" height="8" rx="4" fill="#d2a8ff"/>
  <text x="804" y="288" text-anchor="end" class="mono model-stat">26 (32.9%)</text>

  <!-- Planner 3 -->
  <text x="444" y="320" class="mono model-name">gemini-3-pro</text>
  <rect x="574" y="311" width="136" height="8" rx="4" fill="#21262d"/>
  <rect x="574" y="311" width="44" height="8" rx="4" fill="#bc8cff"/>
  <text x="804" y="320" text-anchor="end" class="mono model-stat">15 (19.0%)</text>

  <!-- Active Harnesses Footer Row inside Right Card -->
  <line x1="428" y1="336" x2="820" y2="336" stroke="#21262d" stroke-width="1"/>
  <text x="444" y="358" class="sans sec-label">HARNESSES</text>
  <text x="804" y="358" text-anchor="end" class="mono model-stat">claude-code &#183; pi &#183; cursor &#183; antigravity</text>

  <!-- Bottom Footer -->
  <text x="24" y="400" class="mono foot">$ git by stats --badge ./assets/ai-provenance.svg</text>
  <circle cx="440.5" cy="396" r="3.5" fill="#3fb950"/>
  <text x="816" y="400" text-anchor="end" textLength="366" class="mono foot">GPG/SSH Intact &#183; Worktree Safe &#183; Zero Fake Co-Authors</text>
</svg>
